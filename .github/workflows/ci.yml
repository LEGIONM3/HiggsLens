name: HiggsLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: uv pip install --system -e .
      - name: Run Ruff Lint
        run: ruff check backend/app backend/tests scripts ml
      - name: Run Mypy Typecheck
        run: mypy backend/app backend/tests scripts ml
      - name: Run Pytest
        run: pytest -v backend/tests

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck
      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test
